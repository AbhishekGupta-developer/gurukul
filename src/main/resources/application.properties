spring.application.name=gurukul

server.port=80

# DB Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/gurukul?createDatabaseIfNotExist=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gurukul?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=admin
spring.security.user.password=Root@1234